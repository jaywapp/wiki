# Deploys the public wiki reader whenever develop changes.
#
# The reader bakes content into public/content.json at build time, so the site
# only changes when a build runs. Without this workflow the sole deploy path is
# a manual `vercel deploy --prebuilt` from a workstation, and the site silently
# falls behind develop. See tools/vercel-build-time-content-stale-trap.md.
#
# Required repository secrets:
#   VERCEL_TOKEN       - https://vercel.com/account/tokens
#   VERCEL_ORG_ID      - orgId in web/.vercel/project.json (not sensitive)
#   VERCEL_PROJECT_ID  - projectId in web/.vercel/project.json (not sensitive)
#
# Pull requests intentionally get no preview: the build's sync step reads
# documents from the develop remote, so a PR preview would show develop's
# content with the PR's app code, which is misleading for docs-only changes.

name: Deploy wiki reader

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-wiki-reader
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify the live site actually advanced
        run: |
          set -euo pipefail
          echo "Deployed: $(cat deployment-url.txt)"
          live=$(curl -fsS https://jaywapp-wiki.vercel.app/content.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.error(`live commit ${j.commit}, ${j.documents.length} documents, generated ${j.generatedAt}`);console.log(j.commit)})')
          echo "live=$live pushed=$GITHUB_SHA"
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "Live index matches the pushed commit."
            exit 0
          fi
          # A newer push may have raced ahead; that is fine, older content is not.
          if git merge-base --is-ancestor "$GITHUB_SHA" "$live"; then
            echo "Live index is newer than the pushed commit (a later push won)."
            exit 0
          fi
          echo "::error::Live index ($live) is older than the pushed commit ($GITHUB_SHA)."
          exit 1
