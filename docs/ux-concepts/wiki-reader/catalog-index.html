<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카탈로그 디자인 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#253145;font:15px/1.7 'Segoe UI','Malgun Gothic',sans-serif}main{max-width:1150px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:0 0 8px}h2{margin:40px 0 4px}p{color:#59687c;margin:0 0 16px}a{color:#2459b8}img{display:block;width:100%;height:auto;border:1px solid #dbe2ec}.mobile{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:650px;margin-top:12px}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}section{padding-bottom:25px;border-bottom:1px solid #dbe2ec}</style></head><body><main><h1>같은 카탈로그, 세 가지 디자인</h1><p>PC에서는 목록 중심으로, 모바일에서는 탐색과 읽기를 오가는 구조입니다. 같은 예시 자료와 기능으로 비교합니다.</p><nav aria-label="디자인 시안"><a href="catalog-a/">A 클리어 사용하기</a><a href="catalog-b/">B 그래파이트 사용하기</a><a href="catalog-c/">C 페이퍼 사용하기</a><a href="index.html">이전 레이아웃 비교</a></nav><section><h2>A. 클리어</h2><p>밝은 화면, 선명한 구분, 넉넉한 여백.</p><img src="catalog-a/preview.png" alt="클리어 데스크톱 시안"><div class="mobile"><img src="catalog-a/mobile-browse.png" alt="클리어 모바일 탐색"><img src="catalog-a/mobile-read.png" alt="클리어 모바일 본문"></div></section><section><h2>B. 그래파이트</h2><p>어두운 화면, 조밀한 목록, 절제된 강조.</p><img src="catalog-b/preview.png" alt="그래파이트 데스크톱 시안" loading="lazy"><div class="mobile"><img src="catalog-b/mobile-browse.png" alt="그래파이트 모바일 탐색" loading="lazy"><img src="catalog-b/mobile-read.png" alt="그래파이트 모바일 본문" loading="lazy"></div></section><section><h2>C. 페이퍼</h2><p>종이 같은 화면, 명조 제목, 여유 있는 본문.</p><img src="catalog-c/preview.png" alt="페이퍼 데스크톱 시안" loading="lazy"><div class="mobile"><img src="catalog-c/mobile-browse.png" alt="페이퍼 모바일 탐색" loading="lazy"><img src="catalog-c/mobile-read.png" alt="페이퍼 모바일 본문" loading="lazy"></div></section></main></body></html>
